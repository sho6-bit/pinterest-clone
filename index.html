<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinterest</title>



    <link rel="stylesheet" href="style.css">
</head>
    
<body>

    <div>

        <div class="collage-background-1">
            <img src="image1.jpg" alt="Image 1">
            <img src="image2.jpg" alt="Image 2">
            <img src="image3.jpg" alt="Image 3">
        </div>

        <div class="collage-background-2">
            <img src="image4.jpg" alt="Image 4">
            <img src="image5.jpg" alt="Image 5">
            <img src="image6.jpg" alt="Image 6">
        </div>

        <div class="collage-background-3">
            <img src="image7.jpg" alt="Image 7">
            <img src="image8.jpg" alt="Image 8">
            <img src="image9.jpg" alt="Image 9">
        </div>

        <div>
            <img src="pinterest-logo.png" alt="Pinterest Logo">
            <h2>Welcome to Pinterest</h2>
            <button>Sign Up</button>
            <button>Log In</button>
            <span>By continuing, you agree to Pinterest's 
                <a href="#">Terms of Service</a> 
                and acknowledge that you have read our 
                <a href="#">Privacy Policy</a>.
            </span>
        </div>

    </div>

    <div class="sign-up2">

        <div>
            <button type="button" onclick="window.history.back()">Back</button>
            <h3>Sign Up</h3>
        </div>

        <div>
            <h1>What's your email?</h1>
            <input type="email" placeholder="Email address">
            <h3>1 of 3</h3>
            <progress value="0" max="100"></progress>
        </div>
    </div>

</body>

</html>
